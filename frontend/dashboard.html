<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPulse Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .dashboard {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card.happy {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .stat-card.neutral {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-card.stressed {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .stat-card .emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stat-card .label {
            font-size: 14px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
        }

        .chart-container {
            margin-top: 40px;
            padding: 30px;
            background: #f7f9fc;
            border-radius: 15px;
        }

        .chart-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .alert {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid;
        }

        .alert.warning {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }

        .alert.success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .alert .icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 TeamPulse Dashboard</h1>
            <p>Weekly Team Wellbeing Insights</p>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        // Mock data for demo (in production, fetch from API)
        const mockData = {
            current_week: [
                { mood: 'happy', count: 45, percentage: 60.0 },
                { mood: 'neutral', count: 20, percentage: 26.7 },
                { mood: 'stressed', count: 10, percentage: 13.3 }
            ],
            previous_week: [
                { mood: 'happy', count: 40, percentage: 57.1 },
                { mood: 'neutral', count: 25, percentage: 35.7 },
                { mood: 'stressed', count: 5, percentage: 7.1 }
            ]
        };

        function renderDashboard(data) {
            const dashboard = document.getElementById('dashboard');

            // Calculate totals
            const totalCurrent = data.current_week.reduce((sum, s) => sum + s.count, 0);
            const totalPrevious = data.previous_week.reduce((sum, s) => sum + s.count, 0);

            // Get individual mood counts
            const happy = data.current_week.find(s => s.mood === 'happy') || { count: 0, percentage: 0 };
            const neutral = data.current_week.find(s => s.mood === 'neutral') || { count: 0, percentage: 0 };
            const stressed = data.current_week.find(s => s.mood === 'stressed') || { count: 0, percentage: 0 };

            // Calculate trend
            const prevStressed = data.previous_week.find(s => s.mood === 'stressed')?.count || 0;
            const currStressed = stressed.count;
            const trendDiff = currStressed - prevStressed;

            let alertHtml = '';
            if (trendDiff > 0) {
                alertHtml = `
                    <div class="alert warning">
                        <span class="icon">⚠️</span>
                        <strong>Alert:</strong> ${trendDiff} more stressed response(s) than last week.
                        Consider scheduling team check-ins or 1:1s.
                    </div>
                `;
            } else if (trendDiff < 0) {
                alertHtml = `
                    <div class="alert success">
                        <span class="icon">✅</span>
                        <strong>Positive trend:</strong> ${Math.abs(trendDiff)} fewer stressed response(s) than last week!
                    </div>
                `;
            }

            dashboard.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card happy">
                        <div class="emoji">😊</div>
                        <div class="label">Happy</div>
                        <div class="value">${happy.count}</div>
                        <div class="label">${happy.percentage}%</div>
                    </div>
                    <div class="stat-card neutral">
                        <div class="emoji">😐</div>
                        <div class="label">Neutral</div>
                        <div class="value">${neutral.count}</div>
                        <div class="label">${neutral.percentage}%</div>
                    </div>
                    <div class="stat-card stressed">
                        <div class="emoji">😟</div>
                        <div class="label">Stressed</div>
                        <div class="value">${stressed.count}</div>
                        <div class="label">${stressed.percentage}%</div>
                    </div>
                </div>

                ${alertHtml}

                <div class="chart-container">
                    <h2>Weekly Comparison</h2>
                    <canvas id="moodChart"></canvas>
                </div>

                <div style="margin-top: 30px; text-align: center; color: #666;">
                    <p><strong>Total check-ins this week:</strong> ${totalCurrent}</p>
                    <p style="margin-top: 10px; font-size: 14px;">
                        All responses are anonymous. Individual check-ins are never shared.
                    </p>
                </div>
            `;

            // Render chart
            renderChart(data);
        }

        function renderChart(data) {
            const ctx = document.getElementById('moodChart').getContext('2d');

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Happy', 'Neutral', 'Stressed'],
                    datasets: [
                        {
                            label: 'This Week',
                            data: [
                                data.current_week.find(s => s.mood === 'happy')?.count || 0,
                                data.current_week.find(s => s.mood === 'neutral')?.count || 0,
                                data.current_week.find(s => s.mood === 'stressed')?.count || 0
                            ],
                            backgroundColor: [
                                'rgba(56, 239, 125, 0.8)',
                                'rgba(79, 172, 254, 0.8)',
                                'rgba(250, 112, 154, 0.8)'
                            ],
                            borderColor: [
                                'rgba(56, 239, 125, 1)',
                                'rgba(79, 172, 254, 1)',
                                'rgba(250, 112, 154, 1)'
                            ],
                            borderWidth: 2
                        },
                        {
                            label: 'Last Week',
                            data: [
                                data.previous_week.find(s => s.mood === 'happy')?.count || 0,
                                data.previous_week.find(s => s.mood === 'neutral')?.count || 0,
                                data.previous_week.find(s => s.mood === 'stressed')?.count || 0
                            ],
                            backgroundColor: [
                                'rgba(56, 239, 125, 0.3)',
                                'rgba(79, 172, 254, 0.3)',
                                'rgba(250, 112, 154, 0.3)'
                            ],
                            borderColor: [
                                'rgba(56, 239, 125, 1)',
                                'rgba(79, 172, 254, 1)',
                                'rgba(250, 112, 154, 1)'
                            ],
                            borderWidth: 2,
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 5
                            }
                        }
                    }
                }
            });
        }

        // Load data (using mock for demo)
        setTimeout(() => {
            renderDashboard(mockData);
        }, 1000);

        // In production, fetch from API:
        // fetch('/api/dashboard?workspace_id=xxx')
        //     .then(res => res.json())
        //     .then(data => renderDashboard(data))
    </script>
</body>
</html>
